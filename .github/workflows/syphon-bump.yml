name: Bump Syphon pin

# Keeps the Syphon.xcframework pin in Package.swift in sync with metaphor's
# latest stable release. See CONTRACT.md (L2a). Three triggers:
#   - repository_dispatch (syphon-release): the live path, fired by metaphor's
#     release workflow with a GitHub App installation token.
#   - schedule: a weekly poll, the backstop for a dispatch that never arrives —
#     works with the repo's own GITHUB_TOKEN, no secret required.
#   - workflow_dispatch: manual backfill.
#
# The PR this opens is auto-merged (see the last step): a pin only reaches
# Homebrew users through a metaphor-cli release, and a PR that waits for a human
# stalls the whole chain. It sat unmerged for 9 days between metaphor v0.8.0 and
# the release that consumed it. release-pipeline-audit.yml watches the end of
# the chain in case this one is the step that breaks.
on:
  repository_dispatch:
    types: [syphon-release]
  schedule:
    - cron: '17 6 * * 1'   # weekly, Mondays 06:17 UTC
  workflow_dispatch:
    inputs:
      tag:
        description: 'metaphor release tag (e.g. v0.3.0). Empty = latest stable.'
        required: false

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Resolve tag and checksum
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          DISPATCH_TAG: ${{ github.event.client_payload.tag }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail
          TAG="${DISPATCH_TAG:-${INPUT_TAG:-}}"
          if [ -z "$TAG" ]; then
            # No explicit tag (scheduled poll): ask metaphor for its latest
            # stable release. /releases/latest excludes drafts and prereleases.
            TAG=$(gh api repos/shinyaoguri/metaphor/releases/latest --jq .tag_name)
          fi
          if [ -z "$TAG" ] || [ "$TAG" = "null" ]; then
            echo "::error::Could not resolve a metaphor release tag."
            exit 1
          fi

          # Already pinned to this tag? Nothing to do — avoids redundant runs/PRs.
          if grep -q "releases/download/${TAG}/" Package.swift; then
            echo "Already pinned to ${TAG}; nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          URL="https://github.com/shinyaoguri/metaphor/releases/download/${TAG}/Syphon.xcframework.zip"
          # Re-derive the checksum from the actually-published asset rather than
          # trusting the dispatched value — the PR must carry a buildable pin.
          curl -fsSL "$URL" -o syphon.zip
          CHECKSUM=$(sha256sum syphon.zip | awk '{print $1}')
          rm -f syphon.zip
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "checksum=$CHECKSUM" >> "$GITHUB_OUTPUT"
          echo "Resolved $TAG -> $CHECKSUM"

      - name: Update Package.swift pin
        if: steps.resolve.outputs.skip != 'true'
        env:
          TAG: ${{ steps.resolve.outputs.tag }}
          CHECKSUM: ${{ steps.resolve.outputs.checksum }}
        run: |
          set -euo pipefail
          sed -i "s|releases/download/v[^/]*/|releases/download/${TAG}/|g" Package.swift
          sed -i "s|checksum: \"[^\"]*\"|checksum: \"${CHECKSUM}\"|g" Package.swift
          echo "--- Package.swift (Syphon pin) ---"
          grep -nE "releases/download|checksum:" Package.swift

      # GITHUB_TOKEN で PR を作ると main の保護を 2 つとも満たせない:
      #   - 再帰防止仕様で `pull_request` CI が発火せず required check が揃わない
      #   - ローカル git commit のままなので required_signatures を満たさない
      # GitHub App のインストールトークンで作ると前者が解消し、`sign-commits: true`
      # (API 経由の commit = GitHub が署名) で後者が解消する。App は release.yml が
      # tap への push に使うものと同一 (docs/homebrew.md にセットアップ手順)。
      # このリポジトリにも Contents: write / Pull requests: write で install が要る。
      - name: Mint app token
        id: app-token
        if: steps.resolve.outputs.skip != 'true'
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.REPO_AUTOMATION_APP_CLIENT_ID }}
          private-key: ${{ secrets.REPO_AUTOMATION_APP_PRIVATE_KEY }}
          owner: shinyaoguri
          repositories: metaphor-cli

      - name: Open pull request
        id: cpr
        if: steps.resolve.outputs.skip != 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ steps.app-token.outputs.token }}
          sign-commits: true
          branch: chore/bump-syphon-${{ steps.resolve.outputs.tag }}
          base: main
          title: "chore: bump Syphon.xcframework pin to ${{ steps.resolve.outputs.tag }}"
          commit-message: "chore: bump Syphon.xcframework pin to ${{ steps.resolve.outputs.tag }}"
          # A new pin only reaches users through a release, so ship it on merge
          # (a chore: title alone would not trigger release-on-merge.yml).
          labels: release:patch
          body: |
            Automated by `syphon-bump.yml` to track metaphor release
            **${{ steps.resolve.outputs.tag }}** (see CONTRACT.md, L2a).

            - URL: `releases/download/${{ steps.resolve.outputs.tag }}/Syphon.xcframework.zip`
            - checksum (re-derived from the published asset): `${{ steps.resolve.outputs.checksum }}`

            `build-and-test` が green になり次第 auto-merge され、`release:patch`
            ラベルで release-on-merge.yml がリリースを出します。止めたいときは
            auto-merge を解除してください。
          delete-branch: true

      # CI green で勝手に入る。中身は「新しい Syphon の URL + checksum」だけで、
      # しかも checksum は公開済みアセットから引き直しているので、人が読んで
      # 判断する余地がほとんどない。むしろ人待ちにしていた期間の実績が悪く
      # (v0.8.0 → 9 日)、その間 brew のユーザーは古い Syphon のままだった。
      # 誤ったピンは build-and-test（実際に binaryTarget を解決する）で落ちる。
      - name: Enable auto-merge
        if: steps.resolve.outputs.skip != 'true' && steps.cpr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_NUMBER: ${{ steps.cpr.outputs.pull-request-number }}
        run: |
          set -euo pipefail
          gh pr merge "$PR_NUMBER" --squash --auto
          echo "auto-merge を有効化しました: PR #${PR_NUMBER}"
