name: Release pipeline audit

# metaphor-cli の最新リリースが brew まで届いたかを毎日 1 回だけ確かめる。
#
# release.yml が tap へ出す Formula PR が止まっても（PR 作成・test-bot・pr-pull の
# どこでも）、cli 側の Release workflow は緑のままになる。ここは個々のワークフローの
# 成否を見ず、最終地点の Formula から逆算するので、まだ知らない壊れ方も同じ 1 本で
# 捕まる。
#
# しきい値(48h)内は「まだ配送中」として黙る。超えたら metaphor-cli に Issue を
# 立て、Formula が最新を指した次の監査でその Issue を自動で閉じる。
on:
  schedule:
    - cron: '0 7 * * *'   # daily, 07:00 UTC
  workflow_dispatch:
    inputs:
      max_lag_hours:
        description: '未達をどれだけ許容するか（時間）'
        required: false
        default: '48'
      dry_run:
        description: '判定だけ表示して起票しない'
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

concurrency:
  group: release-pipeline-audit

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Audit the release pipeline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/audit-release-pipeline.py \
            --max-lag-hours "${{ github.event.inputs.max_lag_hours || '48' }}" \
            ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }}
