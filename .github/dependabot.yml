version: 2

updates:
  # GitHub Actions の陳腐化防止。
  # SwiftPM (package-ecosystem: swift) は登録していない — Package.swift の外部依存は
  # Syphon.xcframework の binaryTarget（URL + checksum）のみで Package.resolved を持たず、
  # この pin は metaphor 側の Release を受けた syphon-bump.yml が自動更新するため。
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # 公開直後の版を掴まないよう 7 日寝かせる
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore
      include: scope
    labels:
      - dependencies
    open-pull-requests-limit: 5
