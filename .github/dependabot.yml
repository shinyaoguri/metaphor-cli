version: 2

updates:
  # GitHub Actions の陳腐化防止。
  # SwiftPM (package-ecosystem: swift) は登録していない — Package.swift に外部依存が
  # 無く（ライブビューアは frame IPC で本体と話す。metaphor#792）、Package.resolved も
  # 持たないため。
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # 公開直後の版を掴まないよう 7 日寝かせる
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore
      include: scope
    labels:
      - dependencies
    open-pull-requests-limit: 5
